name: Verify upstream catalog generation
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/**', 'src/types/**', 'public/catalog.json', '.github/workflows/catalog.yml']
  schedule:
    - cron: '0 12 * * 1'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Jaclenga/tampaBayOpenData
          ref: main
          path: .upstream
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run catalog:generate
      - run: npm run catalog:validate
      - name: Detect upstream changes requiring review
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import cp from 'node:child_process'; const previous=JSON.parse(cp.execFileSync('git',['show','HEAD:public/catalog.json'],{encoding:'utf8'})); const next=JSON.parse(fs.readFileSync('public/catalog.json','utf8')); if(JSON.stringify(previous.datasets)!==JSON.stringify(next.datasets)) throw Error('Upstream checked catalog changed. Regenerate locally and review all changes before publishing.');"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-catalog
          path: public/catalog.json
